<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的音乐">
<title>我的音乐</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #000; color: #ececec;
    overscroll-behavior: none;                /* 禁止下拉刷新 */
    -webkit-user-select: none; user-select: none;
    display: flex; flex-direction: column;
    height: 100dvh;
  }

  /* ---- 桌面端：变成手机样式的卡片 ---- */
  @media (min-width: 600px) {
    body { align-items: center; justify-content: center; padding: 20px 0; }
    .app {
      height: min(880px, 100%);
      max-width: 440px;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
    }
  }

  .app {
    display: flex; flex-direction: column;
    width: 100%; height: 100%;
    max-width: 440px; margin: 0 auto;
    background: #121212; overflow: hidden;
  }

  /* ---- 顶部栏 ---- */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 16px;
  }
  .topbar h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .3px; }
  .add-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #1f1f1f; color: #4ade80;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; line-height: 1; cursor: pointer;
    transition: transform .12s;
  }
  .add-btn:active { transform: scale(.9); background: #262626; }
  #fileInput { display: none; }

  /* ---- 列表区 ---- */
  .list-area { flex: 1; overflow-y: auto; padding: 0 10px 10px; -webkit-overflow-scrolling: touch; }
  .list-area::-webkit-scrollbar { width: 0; }
  #playlist { list-style: none; margin: 0; padding: 0; }

  .song {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 12px; border-radius: 12px; cursor: pointer;
  }
  .song:active { background: #1e1e1e; }
  .song.active { background: #16261c; }
  .song-index { width: 20px; flex-shrink: 0; text-align: center; font-size: 13px; color: #666; font-variant-numeric: tabular-nums; }
  .song.active .song-index { color: #4ade80; }
  .song-name { flex: 1; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song.active .song-name { color: #4ade80; font-weight: 600; }

  /* 正在播放的跳动音柱 */
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 14px; flex-shrink: 0; }
  .bars i { width: 3px; height: 4px; background: #4ade80; border-radius: 2px; animation: bounce .9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; }
  .bars i:nth-child(3) { animation-delay: .3s; }
  .song:not(.active) .bars { visibility: hidden; }
  @keyframes bounce { 0%,100% { height: 4px; } 50% { height: 14px; } }

  .empty { text-align: center; padding: 80px 20px; color: #666; font-size: 15px; line-height: 2; }
  .empty span { font-size: 13px; color: #4a4a4a; }

  /* ---- 底部播放器 ---- */
  .player {
    flex-shrink: 0;
    background: #1a1a1a;
    border-top: 1px solid #262626;
    padding: 12px 20px calc(env(safe-area-inset-bottom) + 14px);
  }
  .now-title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-sub { font-size: 11.5px; color: #777; margin-top: 2px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 5px; border-radius: 3px;
    background: #3a3a3a; outline: none; cursor: pointer;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #4ade80; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #4ade80; border: none;
  }
  #progress { margin-top: 12px; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: #777; margin-top: 5px; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 36px; margin-top: 8px; }
  .ctrl {
    background: none; border: none; color: #ececec;
    font-size: 24px; line-height: 1; padding: 8px; cursor: pointer;
    transition: transform .1s, color .15s;
  }
  .ctrl:active { transform: scale(.88); color: #4ade80; }
  .ctrl-play {
    width: 58px; height: 58px; border-radius: 50%;
    background: #4ade80; color: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; padding: 0;
  }
  .ctrl-play:active { transform: scale(.92); background: #6ee7a0; }

  .volume-row { display: none; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: #777; }
  @media (hover: hover) and (pointer: fine) { .volume-row { display: flex; } }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1>我的音乐</h1>
    <label class="add-btn" for="fileInput" title="添加歌曲">＋</label>
    <input type="file" id="fileInput" accept="audio/*" multiple>
  </header>

  <main class="list-area">
    <ul id="playlist"></ul>
    <div class="empty" id="empty">还没有歌曲<br><span>点右上角 ＋ 添加本地音乐</span></div>
  </main>

  <footer class="player" id="player" hidden>
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-sub" id="nowSub"></div>

    <input type="range" id="progress" min="0" max="0" value="0" step="0.1">
    <div class="time-row">
      <span id="curTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl" id="prevBtn" aria-label="上一首">⏮</button>
      <button class="ctrl ctrl-play" id="playBtn" aria-label="播放">▶</button>
      <button class="ctrl" id="nextBtn" aria-label="下一首">⏭</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
const audio    = document.getElementById('audio');
const playBtn  = document.getElementById('playBtn');
const prevBtn  = document.getElementById('prevBtn');
const nextBtn  = document.getElementById('nextBtn');
const progress = document.getElementById('progress');
const curTimeEl = document.getElementById('curTime');
const totalTimeEl = document.getElementById('totalTime');
const volumeEl = document.getElementById('volume');
const fileInput = document.getElementById('fileInput');
const listEl   = document.getElementById('playlist');
const emptyEl  = document.getElementById('empty');
const playerEl = document.getElementById('player');
const nowTitle = document.getElementById('nowTitle');
const nowSub   = document.getElementById('nowSub');

let playlist = [];
let currentIndex = -1;
let isSeeking = false;

/* ---------- 小工具 ---------- */
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function fillSlider(el) {
  const pct = el.max > 0 ? (el.value / el.max) * 100 : 0;
  el.style.background = `linear-gradient(to right, #4ade80 ${pct}%, #3a3a3a ${pct}%)`;
}

/* ---------- 选歌 ---------- */
fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  playlist.forEach(item => URL.revokeObjectURL(item.url));   // 释放旧内存
  playlist = files.map(file => ({
    name: file.name.replace(/\.[^.]+$/, ''),
    url: URL.createObjectURL(file)
  }));
  renderPlaylist();
  playIndex(0);
  fileInput.value = '';
});

/* ---------- 列表渲染 ---------- */
function renderPlaylist() {
  listEl.innerHTML = '';
  const has = playlist.length > 0;
  emptyEl.hidden = has;
  playerEl.hidden = !has;
  if (!has) return;

  playlist.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'song';
    li.dataset.index = i;

    const idx = document.createElement('span');
    idx.className = 'song-index';
    idx.textContent = i + 1;

    const name = document.createElement('span');
    name.className = 'song-name';
    name.textContent = item.name;

    const bars = document.createElement('span');
    bars.className = 'bars';
    bars.innerHTML = '<i></i><i></i><i></i>';

    li.append(idx, name, bars);
    li.addEventListener('click', () => {
      if (i === currentIndex) togglePlay();
      else playIndex(i);
    });
    listEl.appendChild(li);
  });
  highlight();
}

function highlight() {
  [...listEl.children].forEach((li, i) => {
    li.classList.toggle('active', i === currentIndex);
  });
}

/* ---------- 播放核心 ---------- */
function playIndex(i) {
  if (i < 0 || i >= playlist.length) return;
  currentIndex = i;
  const item = playlist[i];

  audio.src = item.url;
  audio.play().catch(err => console.warn('播放失败：', err));

  nowTitle.textContent = item.name;
  nowSub.textContent = `第 ${i + 1} / ${playlist.length} 首`;
  highlight();
  updateMediaSession(item);
}

function togglePlay() {
  if (!playlist.length) return;
  if (audio.paused) audio.play().catch(e => console.warn(e));
  else audio.pause();
}

playBtn.addEventListener('click', togglePlay);

prevBtn.addEventListener('click', () => {
  if (!playlist.length) return;
  if (audio.currentTime > 3) audio.currentTime = 0;
  else playIndex((currentIndex - 1 + playlist.length) % playlist.length);
});

nextBtn.addEventListener('click', () => {
  if (!playlist.length) return;
  playIndex((currentIndex + 1) % playlist.length);
});

/* ---------- 音频事件 ---------- */
audio.addEventListener('play',  () => { playBtn.textContent = '⏸'; setPlaybackState('playing'); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; setPlaybackState('paused'); });

audio.addEventListener('loadedmetadata', () => {
  progress.max = audio.duration || 0;
  totalTimeEl.textContent = formatTime(audio.duration);
  fillSlider(progress);
});

audio.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  progress.value = audio.currentTime;
  curTimeEl.textContent = formatTime(audio.currentTime);
  fillSlider(progress);
});

audio.addEventListener('ended', () => {
  if (playlist.length > 1) playIndex((currentIndex + 1) % playlist.length);
  else { audio.currentTime = 0; playBtn.textContent = '▶'; }
});

/* ---------- 进度拖动 ---------- */
progress.addEventListener('input', () => {
  isSeeking = true;
  curTimeEl.textContent = formatTime(+progress.value);
  fillSlider(progress);
});
progress.addEventListener('change', () => {
  audio.currentTime = +progress.value;
  isSeeking = false;
});

/* ---------- 音量（桌面端） ---------- */
audio.volume = +volumeEl.value;
fillSlider(volumeEl);
volumeEl.addEventListener('input', () => {
  audio.volume = +volumeEl.value;
  fillSlider(volumeEl);
});

/* ---------- 锁屏 / 通知栏控制（Media Session） ---------- */
function updateMediaSession(item) {
  if (!('mediaSession' in navigator) || !item) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: item.name,
    artist: '本地音乐',
    album: '我的音乐库',
    artwork: [{ src: './icon.svg', sizes: 'any', type: 'image/svg+xml' }]
  });
}
function setPlaybackState(state) {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = state;
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play',  () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
  navigator.mediaSession.setActionHandler('nexttrack',     () => nextBtn.click());
}

/* ---------- 快捷键（桌面端） ---------- */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') audio.currentTime += 5;
  if (e.code === 'ArrowLeft')  audio.currentTime -= 5;
});

/* ---------- 注册 Service Worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
